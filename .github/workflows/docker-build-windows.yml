name: Build Windows Binary

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: goosestation-builder:latest
          cache-from: type=gha

      - name: Build Windows binary
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD/dist:/work/dist" \
            -v "$PWD/.cache:/work/.cache" \
            goosestation-builder:latest \
            windows

      - name: Upload Windows binary as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goosestation-windows
          path: dist/windows/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/windows/goosestation_libretro.dll
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
